[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-truthguard"
version = "0.1.0"
description = "Evidence-based AI claim verification system"
requires-python = ">=3.10"
authors = [
    {name = "Aman Jha", email = "jhaaman.bcse2024@huroorkee.ac.in"}
]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "sqlalchemy==2.1.6",
    "bcrypt==4.0.1",
    "psycopg2-binary==2.9.13",
    "pypdf==6.21.4",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests>=2.31.0",
]
all = [
    "ai-truthguard[dev]",
]

[tool.setuptools.packages]
find = {where = ["."]}

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
